experiment:
  start_date: "2024-10-01"
  end_date: "2024-10-01"
  init_weekdays:
    - Tuesday
    - Friday
  init_months:
    - 10
    - 11
    - 12
    - 1
    - 2
    - 3
    - 4
  forecast_days: 42
