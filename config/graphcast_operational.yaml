experiment:
  start_date: "2024-10-01"
  end_date: "2025-04-30"
  init_weekdays:
    - Tuesday
    - Friday
  forecast_days: 42
  hours_per_step: 6

model:
  name: GraphCastOperational
  device: cuda

variables:
  surface:
    - msl
    - t2m
    - tp06
    - u10m
    - v10m

  pressure_levels:
    - 50
    - 100
    - 150
    - 200
    - 250
    - 300
    - 400
    - 500
    - 600
    - 700
    - 850
    - 925
    - 1000

  pressure_variables:
    - t
    - u
    - v
    - q
    - z

output:
  compression_level: 1
  zarr_backend: sync
  write_mode: local_then_stage
  async_pool_size: 4
  shard_lead_times: 1
  local_root: "/lscratch/{user}/graphcast-operational"
  staging_root: "/scratch/{user}/weather-ai/graphcast-operational/.staging"
  final_root: "/scratch/{user}/weather-ai/graphcast-operational"

converter:
  poll_seconds: 5
  workers: 2

validation:
  expected_variable_count: 70
